<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PV Réception Chantier</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0d1117; --card: #161b22; --card2: #1c2128; --border: #30363d;
  --text: #f0f3f6; --muted: #7d8590; --green: #2ea043; --green-glow: rgba(46,160,67,0.2);
  --blue: #1f6feb; --blue-glow: rgba(31,111,235,0.2); --danger: #f85149;
  --r: 14px; --rs: 10px;
}
html, body { height: 100%; overflow: hidden; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; }

.hdr { padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.hdr-icon { width: 36px; height: 36px; background: var(--green); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; box-shadow: 0 0 14px var(--green-glow); flex-shrink: 0; }
.hdr-text { flex: 1; min-width: 0; }
.hdr-text h1 { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; }
.hdr-text p { font-size: 11px; color: var(--muted); margin-top: 1px; }
.hdr-right { display: flex; align-items: center; gap: 8px; }
.prog-track { width: 52px; height: 4px; background: var(--card2); border-radius: 2px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width .5s ease; width: 0%; }
.prog-pct { font-size: 10px; color: var(--muted); min-width: 28px; text-align: right; }

.chat { flex: 1; overflow-y: auto; padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
.chat::-webkit-scrollbar { width: 3px; }
.chat::-webkit-scrollbar-thumb { background: var(--border); }

.row { display: flex; flex-direction: column; animation: up .3s ease; }
@keyframes up { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.row.agent { align-items: flex-start; }
.row.user  { align-items: flex-end; }
.lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin-bottom: 4px; }
.row.user .lbl { text-align: right; }
.bubble { padding: 11px 15px; border-radius: var(--r); font-size: 14px; line-height: 1.6; max-width: 86vw; white-space: pre-wrap; word-break: break-word; }
.row.agent .bubble { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
.row.user  .bubble { background: var(--blue); color: #fff; border-bottom-right-radius: 3px; }

.dots { display: flex; gap: 4px; padding: 12px 15px; }
.dots span { width: 6px; height: 6px; background: var(--muted); border-radius: 50%; animation: dot 1.2s infinite; }
.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }
@keyframes dot { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-5px);opacity:1} }

.actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; max-width: 86vw; }
.action-btn { padding: 9px 15px; background: var(--card2); border: 1px solid var(--border); border-radius: 50px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--text); cursor: pointer; transition: all .15s; }
.action-btn:active { background: var(--blue); border-color: var(--blue); color: #fff; }

.sig-wrap { margin-top: 10px; max-width: 86vw; }
.sig-canvas { width: 100%; height: 130px; background: #fff; border-radius: var(--rs); cursor: crosshair; touch-action: none; display: block; }
.sig-btns { display: flex; gap: 8px; margin-top: 8px; }
.sig-btn { flex: 1; padding: 10px; border: none; border-radius: var(--rs); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; }
.sig-btn.clear { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
.sig-btn.ok { background: var(--green); color: #fff; }

.photo-wrap { margin-top: 10px; max-width: 86vw; }
.photo-zone { border: 2px dashed var(--border); border-radius: var(--rs); padding: 20px 14px; text-align: center; cursor: pointer; }
.photo-zone .ico { font-size: 26px; margin-bottom: 5px; }
.photo-zone p { font-size: 12px; color: var(--muted); }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.thumb { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; border: 2px solid var(--border); }
.confirm-btn { width: 100%; margin-top: 10px; padding: 12px; background: var(--green); border: none; border-radius: var(--rs); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; }

.bar { padding: 12px 14px; background: var(--card); border-top: 1px solid var(--border); flex-shrink: 0; }
.bar-row { display: flex; gap: 9px; align-items: flex-end; }
.bar-field { flex: 1; background: var(--card2); border: 1px solid var(--border); border-radius: var(--rs); padding: 11px 14px; transition: border-color .2s; }
.bar-field:focus-within { border-color: var(--blue); }
.bar-field input { width: 100%; background: none; border: none; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; outline: none; }
.bar-field input::placeholder { color: var(--muted); }
.send { width: 44px; height: 44px; background: var(--blue); border: none; border-radius: var(--rs); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 2px 12px var(--blue-glow); }
.send svg { width: 18px; height: 18px; }

.submit-wrap { padding: 0 14px 14px; }
.submit-btn { width: 100%; padding: 15px; background: var(--green); border: none; border-radius: var(--rs); color: #fff; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 20px var(--green-glow); }
.submit-btn:disabled { opacity: .5; cursor: wait; }

.success { position: fixed; inset: 0; background: rgba(13,17,23,.97); display: flex; align-items: center; justify-content: center; z-index: 99; padding: 24px; animation: up .4s ease; }
.success-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 36px 28px; text-align: center; max-width: 340px; width: 100%; }
.success-ico { width: 64px; height: 64px; background: var(--green); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 18px; box-shadow: 0 6px 24px var(--green-glow); }
.success-card h2 { font-family: 'Syne', sans-serif; font-size: 20px; margin-bottom: 8px; }
.success-card p { font-size: 13px; color: var(--muted); line-height: 1.5; }
.new-btn { width: 100%; margin-top: 20px; padding: 14px; background: var(--green); border: none; border-radius: var(--rs); color: #fff; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; }

.hidden { display: none !important; }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-icon">🏗️</div>
  <div class="hdr-text">
    <h1>PV Réception Chantier</h1>
    <p>Assistant terrain — Happy Confort</p>
  </div>
  <div class="hdr-right">
    <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
    <span class="prog-pct" id="progPct">0%</span>
  </div>
</div>

<div class="chat" id="chat"></div>
<div class="bar" id="bar">
  <div class="bar-row">
    <div class="bar-field">
      <input id="inp" type="text" placeholder="Écrivez votre réponse..." autocomplete="off" autocorrect="off" />
    </div>
    <button class="send" id="sendBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
    </button>
  </div>
</div>

<script>
const CLAUDE_API  = '/api/claude';
const JOTFORM_API = 'https://eu-api.jotform.com';
const JOTFORM_KEY = 'fe63b6658c5fecc581fdc308ef48664f';
const FORM_ID     = '241082386472054';

let history = [];
let collectedData = {};
let photoFiles = {};
let sigBlobs = {};
let jotQids = null;
let busy = false;

const SYSTEM = `Tu es un assistant terrain pour Happy Confort. Tu aides les techniciens à remplir le PV de réception chantier.

COMPORTEMENT :
- Tu parles naturellement et brièvement (on est sur smartphone, sur le terrain)
- Tu poses UNE seule question à la fois
- Tu valides les informations (email avec @, date cohérente, etc.)
- Si le technicien se trompe ou veut corriger, tu acceptes et continues
- Tu es sympa et encourageant

DONNÉES À COLLECTER dans l'ordre :
1. Nom du technicien
2. Nom du client
3. Email du client (valider format)
4. Chantier(s) : PAC AIR/EAU, PAC AIR/AIR, Ballon thermodynamique, Panneaux PV (plusieurs possibles)
5. Date de fin de chantier
6. Adresse du chantier
7. Réception : "Sans réserve" ou "Avec réserves"
8. Si réserves → description
9. Photos selon chantiers réalisés
10. Date de signature
11. Signature client
12. Signature technicien

COMMANDES SPÉCIALES (à inclure dans ta réponse quand nécessaire) :
- Pour demander des photos : écris [PHOTO:photos_ue_eau] ou [PHOTO:photos_ui_eau] ou [PHOTO:photos_ui_air] ou [PHOTO:photos_ue_air] ou [PHOTO:photos_ballon] ou [PHOTO:photos_pv]
- Pour demander une signature : écris [SIGNATURE:sig_client] ou [SIGNATURE:sig_societe]
- Pour proposer des boutons rapides : écris les options entre {{}} ex: {{Sans réserve}} {{Avec réserves}}
- Quand TOUT est collecté (données + photos + 2 signatures) : écris [ENVOYER] dans ta réponse

DONNÉES DÉJÀ COLLECTÉES :
{{DATA}}`;

// ── UI ──
const chatEl = document.getElementById('chat');
const barEl  = document.getElementById('bar');
const inpEl  = document.getElementById('inp');

function scroll() { setTimeout(() => chatEl.scrollTo({top: chatEl.scrollHeight, behavior:'smooth'}), 60); }

function addAgent(text, widget) {
  const row = document.createElement('div');
  row.className = 'row agent';
  row.innerHTML = `<div class="lbl">Agent</div><div class="bubble">${text.replace(/\n/g,'<br>')}</div>`;
  if (widget) row.appendChild(widget);
  chatEl.appendChild(row);
  scroll();
}

function addUser(text) {
  const row = document.createElement('div');
  row.className = 'row user';
  row.innerHTML = `<div class="lbl" style="text-align:right">Vous</div><div class="bubble">${text}</div>`;
  chatEl.appendChild(row);
  scroll();
}

function showDots() {
  const t = document.createElement('div');
  t.className = 'row agent'; t.id = 'dots';
  t.innerHTML = `<div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>`;
  chatEl.appendChild(t); scroll();
}
function hideDots() { document.getElementById('dots')?.remove(); }

function setProgress(pct) {
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progPct').textContent = Math.round(pct) + '%';
}

// ── PARSE ──
function parse(text) {
  const actions = [];
  let clean = text.replace(/\{\{([^}]+)\}\}/g, (_, a) => { actions.push(a.trim()); return ''; });
  const photo = clean.match(/\[PHOTO:([^\]]+)\]/)?.[1];
  const sig   = clean.match(/\[SIGNATURE:([^\]]+)\]/)?.[1];
  const send  = clean.includes('[ENVOYER]');
  clean = clean.replace(/\[PHOTO:[^\]]+\]/g,'').replace(/\[SIGNATURE:[^\]]+\]/g,'').replace(/\[ENVOYER\]/g,'').trim();
  return { clean, actions, photo, sig, send };
}

// ── ACTIONS ──
function makeActions(actions) {
  if (!actions.length) return null;
  const div = document.createElement('div');
  div.className = 'actions';
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'action-btn'; b.textContent = a;
    b.onclick = () => { div.remove(); send(a); };
    div.appendChild(b);
  });
  return div;
}

// ── SIGNATURE ──
function makeSig(sigId) {
  const wrap = document.createElement('div');
  wrap.className = 'sig-wrap';
  const uid = 'c_' + sigId;
  wrap.innerHTML = `<canvas class="sig-canvas" id="${uid}"></canvas>
    <div class="sig-btns">
      <button class="sig-btn clear" onclick="clrSig('${uid}')">Effacer</button>
      <button class="sig-btn ok" onclick="okSig('${uid}','${sigId}')">✓ Valider</button>
    </div>`;
  setTimeout(() => {
    const c = document.getElementById(uid); if (!c) return;
    c.width = c.offsetWidth * devicePixelRatio;
    c.height = c.offsetHeight * devicePixelRatio;
    const ctx = c.getContext('2d');
    ctx.scale(devicePixelRatio, devicePixelRatio);
    ctx.strokeStyle = '#0d1117'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    let d=false, lx, ly;
    const p = e => { const r=c.getBoundingClientRect(), t=e.touches?.[0]||e; return {x:t.clientX-r.left, y:t.clientY-r.top}; };
    c.addEventListener('mousedown',  e => { d=true; ({x:lx,y:ly}=p(e)); });
    c.addEventListener('mousemove',  e => { if(!d) return; const {x,y}=p(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(x,y); ctx.stroke(); lx=x; ly=y; });
    c.addEventListener('mouseup',    () => d=false);
    c.addEventListener('touchstart', e => { e.preventDefault(); d=true; ({x:lx,y:ly}=p(e)); }, {passive:false});
    c.addEventListener('touchmove',  e => { e.preventDefault(); if(!d) return; const {x,y}=p(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(x,y); ctx.stroke(); lx=x; ly=y; }, {passive:false});
    c.addEventListener('touchend',   () => d=false);
  }, 80);
  return wrap;
}

function clrSig(uid) { const c=document.getElementById(uid); c?.getContext('2d').clearRect(0,0,c.width,c.height); }
function okSig(uid, sigId) {
  document.getElementById(uid)?.toBlob(b => sigBlobs[sigId]=b, 'image/png');
  collectedData[sigId] = '✓ Signé';
  document.getElementById(uid)?.closest('.sig-wrap')?.remove();
  send('Signature validée ✓');
}

// ── PHOTO ──
function makePhoto(photoId) {
  const wrap = document.createElement('div');
  wrap.className = 'photo-wrap';
  const uid = 'pf_' + photoId;
  wrap.innerHTML = `
    <div class="photo-zone" onclick="document.getElementById('${uid}').click()">
      <div class="ico">📷</div><p>Toucher pour prendre ou choisir des photos</p>
    </div>
    <input type="file" id="${uid}" accept="image/*" multiple capture="environment" class="hidden" onchange="onPhoto('${photoId}',this)" />
    <div class="thumbs" id="th_${photoId}"></div>
    <button class="confirm-btn hidden" id="ok_${photoId}" onclick="okPhoto('${photoId}')">✓ Valider les photos</button>`;
  return wrap;
}

function onPhoto(id, input) {
  const files = [...input.files]; if(!files.length) return;
  photoFiles[id] = files;
  const t = document.getElementById('th_'+id); t.innerHTML='';
  files.forEach(f => { const r=new FileReader(); r.onload=e=>{ const i=document.createElement('img'); i.src=e.target.result; i.className='thumb'; t.appendChild(i); }; r.readAsDataURL(f); });
  document.getElementById('ok_'+id).classList.remove('hidden');
}

function okPhoto(id) {
  const n = photoFiles[id]?.length || 0;
  collectedData[id] = `${n} photo(s)`;
  document.getElementById('ok_'+id)?.closest('.photo-wrap')?.remove();
  send(`${n} photo(s) ajoutée(s) ✓`);
}

// ── SUBMIT BUTTON ──
function showSubmitBtn() {
  const wrap = document.createElement('div');
  wrap.className = 'submit-wrap';
  wrap.innerHTML = `<button class="submit-btn" id="submitBtn" onclick="submitJotform()">Envoyer le PV à Jotform ✓</button>`;
  chatEl.appendChild(wrap);
  scroll();
}

// ── MAIN SEND ──
async function send(userText) {
  if (busy) return;
  busy = true;
  inpEl.disabled = true;

  addUser(userText);
  inpEl.value = '';
  history.push({role:'user', content: userText});
  showDots();

  try {
    const system = SYSTEM.replace('{{DATA}}', JSON.stringify(collectedData, null, 2));
    const res = await fetch(CLAUDE_API, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      })
    });
    const data = await res.json();
    const raw = data.content?.[0]?.text || 'Désolé, une erreur est survenue.';
    history.push({role:'assistant', content: raw});
    hideDots();

    const {clean, actions, photo, sig, send: doSend} = parse(raw);

    // Progress heuristic
    const keys = ['technicien','client_nom','client_email','chantiers','date_fin','adresse','reception','date_signature','sig_client','sig_societe'];
    setProgress(keys.filter(k=>collectedData[k]).length / keys.length * 100);

    if (doSend) {
      addAgent(clean, makeActions(actions));
      showSubmitBtn();
    } else if (photo) {
      addAgent(clean, makePhoto(photo));
    } else if (sig) {
      addAgent(clean, makeSig(sig));
    } else {
      addAgent(clean, makeActions(actions));
      inpEl.disabled = false;
      setTimeout(()=>inpEl.focus(), 100);
    }

  } catch(err) {
    hideDots();
    addAgent(`⚠️ Erreur : ${err.message}`);
    inpEl.disabled = false;
  }
  busy = false;
}

// ── JOTFORM SUBMIT ──
async function submitJotform() {
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Extraction des données...';

  try {
    // Extract structured data via Claude
    const extractRes = await fetch(CLAUDE_API, {
      method:'POST',
      headers:{'Content-Type':'application/json'}, du PV de réception depuis cette conversation. Réponds UNIQUEMENT en JSON valide, sans markdown, avec exactement ces clés:
{"Nom du technicien":"","Nom du client":"","Email du client":"","Chantier(s) réalisé(s)":"","Date de fin de chantier ":"","Adresse de signature":"","Le client déclare que la réception est prononcée:":"","ETAT DES RESERVES":"","Date de signature":""}`,
        messages: history
      })
    });
    const extractData = await extractRes.json();
    let extracted = {};
    try { extracted = JSON.parse(extractData.content[0].text.replace(/```json|```/g,'').trim()); } catch {}

    btn.textContent = 'Chargement formulaire...';

    if (!jotQids) {
      const r = await fetch(`${JOTFORM_API}/form/${FORM_ID}/questions?apiKey=${JOTFORM_KEY}`);
      const d = await r.json();
      if (d.responseCode !== 200) throw new Error(d.message);
      jotQids = d.content;
    }

    btn.textContent = 'Envoi en cours...';
    const fd = new FormData();

    for (const [label, value] of Object.entries(extracted)) {
      if (!value) continue;
      const qid = Object.keys(jotQids).find(k => jotQids[k].text === label);
      if (!qid) continue;
      const qtype = jotQids[qid].type;
      if (qtype === 'control_fullname') {
        const p = String(value).split(' ');
        fd.append(`submission[${qid}][first]`, p[0]||'');
        fd.append(`submission[${qid}][last]`, p.slice(1).join(' ')||'');
      } else if (qtype === 'control_datetime') {
        const d = new Date(value);
        if (!isNaN(d)) {
          fd.append(`submission[${qid}][month]`, String(d.getMonth()+1).padStart(2,'0'));
          fd.append(`submission[${qid}][day]`,   String(d.getDate()).padStart(2,'0'));
          fd.append(`submission[${qid}][year]`,  String(d.getFullYear()));
        } else fd.append(`submission[${qid}]`, value);
      } else {
        fd.append(`submission[${qid}]`, String(value));
      }
    }

    // Photos
    const photoMap = {photos_ue_eau:'Photos UE PAC AIR / EAU', photos_ui_eau:'Photos UI PAC AIR / EAU', photos_ui_air:'Photos UI PAC AIR / AIR', photos_ue_air:'Photos UE PAC AIR / AIR', photos_ballon:'Photos Ballon thermodynamique', photos_pv:'Photos PV'};
    for (const [id, label] of Object.entries(photoMap)) {
      if (!photoFiles[id]) continue;
      const qid = Object.keys(jotQids).find(k => jotQids[k].text === label);
      if (!qid) continue;
      photoFiles[id].forEach((f,i) => fd.append(`submission[${qid}][${i}]`, f));
    }

    // Signatures
    const sigMap = {sig_client:'Signature client', sig_societe:'Signature représentant de la société'};
    for (const [id, label] of Object.entries(sigMap)) {
      if (!sigBlobs[id]) continue;
      const qid = Object.keys(jotQids).find(k => jotQids[k].text === label);
      if (!qid) continue;
      fd.append(`submission[${qid}]`, sigBlobs[id], 'signature.png');
    }

    const res = await fetch(`${JOTFORM_API}/form/${FORM_ID}/submissions?apiKey=${JOTFORM_KEY}`, {method:'POST', body:fd});
    const result = await res.json();
    if (result.responseCode !== 200) throw new Error(result.message || 'Erreur Jotform');

    const ov = document.createElement('div');
    ov.className = 'success';
    ov.innerHTML = `<div class="success-card"><div class="success-ico">✓</div><h2>PV envoyé !</h2><p>Le procès-verbal a été soumis avec succès dans Jotform.</p><button class="new-btn" onclick="location.reload()">Nouveau PV</button></div>`;
    document.body.appendChild(ov);

  } catch(err) {
    btn.disabled = false; btn.textContent = '⚠️ Erreur — Réessayer';
    addAgent(`Erreur lors de l'envoi : ${err.message}`);
  }
}

// ── BOOT ──
document.getElementById('sendBtn').onclick = () => { const v=inpEl.value.trim(); if(v&&!busy) send(v); };
inpEl.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); const v=inpEl.value.trim(); if(v&&!busy) send(v); } });

// Start conversation
send('Bonjour');
</script>
</body>
</html>
